<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 264">
    <style>
        @media (prefers-reduced-motion: no-preference) {
            .swing { transform-origin: 200px 109px; animation: swing 5.8s ease-in-out infinite; }
            .breathing { transform-origin: 215px 178px; animation: breathe 3.2s ease-in-out infinite; }
            .dreams { animation: drift 4.7s ease-in-out infinite; }
            .stars { animation: twinkle 4.2s ease-in-out infinite alternate; }
        }
        @keyframes swing {
            0%, 100% { transform: rotate(-2.1deg); }
            50% { transform: rotate(2.1deg); }
        }
        @keyframes breathe { 50% { transform: scale(1.025, 1.09); } }
        @keyframes drift {
            0% { transform: translate(-7px, 6px); opacity: 0; }
            22%, 68% { opacity: 1; }
            100% { transform: translate(16px, -15px); opacity: 0; }
        }
        @keyframes twinkle { to { opacity: .3; } }
    </style>
    <defs>
        <linearGradient id="sky" x2="100%" y2="100%">
            <stop stop-color="#3d2d68"/><stop offset="1" stop-color="#211b3c"/>
        </linearGradient>
        <linearGradient id="fur" x2="0" y2="100%">
            <stop stop-color="#f8c88d"/><stop offset="1" stop-color="#cb8b67"/>
        </linearGradient>
    </defs>
    <rect x="2" y="2" width="396" height="260" rx="32" fill="url(#sky)"/>
    <path d="M309 39a23 23 0 1 0 28 28 25 25 0 0 1-28-28Z" fill="#ffdfa2"/>
    <g stroke="#d4c0ff" stroke-width="2.5" stroke-linecap="round" opacity=".75">
        <path class="stars" d="M64 55h14m-7-7v14m270 34h12m-6-6v12M221 37h10m-5-5v10M281 113h8m-4-4v8M96 30h10m-5-5v10"/>
        <path class="dreams" d="M169 79h12l-12 12h12m9-33h16l-16 16h16m8-32h19l-19 19h19" fill="none"/>
    </g>
    <ellipse cx="200" cy="223" rx="151" ry="13" fill="#131126" opacity=".65"/>
    <path d="M58 218V98m284 120V98" fill="none" stroke-linecap="round" stroke="#735e93" stroke-width="8"/>
    <g class="swing">
        <path d="M59 109L93 156m248-47-33 47" fill="none" stroke-linecap="round" stroke="#d4c0ff" stroke-width="3"/>
        <g class="breathing" fill="url(#fur)" stroke="#31203d" stroke-width="5">
            <ellipse cx="216" cy="153" rx="75" ry="39" transform="rotate(13 216 153)"/>
            <ellipse cx="280" cy="143" rx="30" ry="17" transform="rotate(-24 280 143)"/>
            <ellipse cx="215" cy="152" rx="38" ry="13" transform="rotate(11 215 152)"/>
        </g>
        <g transform="translate(125 131) rotate(-16)" stroke="#31203d" stroke-width="5">
            <circle cx="-33" cy="-26" r="17" fill="#d09576"/><circle cx="33" cy="-26" r="17" fill="#d09576"/>
            <path d="M0-38c-29 0-47 18-47 42 0 25 20 40 47 40S47 29 47 4C47-20 29-38 0-38Z" fill="url(#fur)"/>
            <ellipse cy="22" rx="23" ry="16" fill="#ffe6b9" stroke="none"/>
            <path d="M-12-1h24m-56-5h8m72 0h8" fill="none" stroke-linecap="round"/>
            <rect x="-39" y="-15" width="33" height="26" rx="9" fill="#ded8ff"/>
            <rect x="6" y="-15" width="33" height="26" rx="9" fill="#ded8ff"/>
            <path d="M-31-2q8 8 16 0m30 0q8 8 16 0M-6 28q6 6 12 0" fill="none" stroke-width="2.8" stroke-linecap="round"/>
            <path d="M-7 17q7-5 14 0-1 7-7 7t-7-7Z" fill="#31203d" stroke="none"/>
        </g>
        <path d="M86 149q110 59 228 0-22 52-109 62-76 4-119-62Z" fill="#8f70dc" stroke="#30234e" stroke-width="4"/>
        <path d="M89 151q107 56 222 0M103 176q96 47 191 1" fill="none" stroke="#c6b0ff" stroke-width="3" stroke-linecap="round" opacity=".85"/>
    </g>
</svg>
